name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything in this job needs no DSH install and no browser, so it is the
  # cheapest place to catch the bugs that only show up on another platform.
  offline:
    name: offline / node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Visibility, channel and module-root policy
        run: node test/portability.mjs
      - name: Offline installer against a throwaway profile
        run: node test/installer.mjs

  # The schema contract, the registry mount and the smoke test need the real
  # DSH runtime, which is only published as prereleases.
  runtime:
    name: runtime / node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installed into the checkout rather than globally: the plugin resolves a
      # plugin-local `node_modules` first, so this works no matter what global
      # prefix the runner happens to use. The registry test launches a browser,
      # so this has to happen before it.
      - name: Install Playwright into the checkout
        run: npm i --no-save --no-package-lock playwright playwright-core

      - name: Install Chromium with system libraries (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Chromium (macOS and Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      # `npm i -g @deepseek-ai/dsh` fails on npm 10: every published version is a
      # prerelease, so the bare spec resolves through `*`, which semver does not
      # allow to match a prerelease. Ask the registry for the exact version its
      # `latest` tag points at instead, and fall back to the `next` tag.
      - name: Install DSH
        shell: bash
        run: |
          version="$(npm view @deepseek-ai/dsh dist-tags.latest)"
          echo "DSH latest tag: ${version}"
          npm i -g "@deepseek-ai/dsh@${version}" || npm i -g @deepseek-ai/dsh@next
          # GitHub's Windows runners put global packages under C:\npm\prefix,
          # which is not where a naive probe looks. Tell the tests where npm
          # actually wrote them instead of guessing.
          echo "DSH_TOOLS_ROOT=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Schema contract (byte-identical to defineTool)
        run: node test/verify-tools.mjs

      - name: Registry mount with the real executor
        run: node test/registry.mjs

      - name: Browser smoke test
        run: node test/smoke.mjs
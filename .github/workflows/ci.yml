name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything in this job needs no DSH install and no browser, so it is the
  # cheapest place to catch the bugs that only show up on another platform.
  offline:
    name: offline / node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Visibility, channel and module-root policy
        run: node test/portability.mjs
      - name: Offline installer against a throwaway profile
        run: node test/installer.mjs

  # The schema contract and the registry mount need the real DSH runtime, which
  # is only published as prereleases.
  runtime:
    name: runtime / node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm i -g @deepseek-ai/dsh` fails on npm 10: every published version is a
      # prerelease, so the bare spec resolves through `*`, which semver does not
      # allow to match a prerelease. Ask the registry for the exact version its
      # `latest` tag points at instead, and fall back to the `next` tag.
      - name: Install DSH
        shell: bash
        run: |
          version="$(npm view @deepseek-ai/dsh dist-tags.latest)"
          echo "DSH latest tag: ${version}"
          npm i -g "@deepseek-ai/dsh@${version}" || npm i -g @deepseek-ai/dsh@next

      - name: Schema contract (byte-identical to defineTool)
        run: node test/verify-tools.mjs

      - name: Registry mount with the real executor
        run: node test/registry.mjs

      - name: Install Playwright
        run: npm i -g playwright playwright-core

      - name: Install Chromium with system libraries (Linux only)
        if: runner.os == 'Linux'
        run: playwright install chromium --with-deps

      - name: Install Chromium (macOS and Windows)
        if: runner.os != 'Linux'
        run: playwright install chromium

      - name: Browser smoke test
        run: node test/smoke.mjs